# AstrBot 插件元数据（发布到插件市场所需）
# 字段说明：https://docs.astrbot.app/dev/star/plugin-publish.html

# 插件唯一标识（必须与 @register 第一个参数一致，且以 astrbot_plugin_ 开头）
name: astrbot_plugin_PlayStationGames

# 用于市场列表展示的友好名称
display_name: PlayStation玩家数据

# 详细介绍（市场详情页展示）
desc: PlayStation（PSN）玩家数据可视化插件。绑定 PSN 在线 ID 后，可查询个人资料/在线状态/游戏库/游戏时长/奖杯、指定游戏的时长与奖杯详情、群内多维度排行榜（肝度/游戏数/奖杯/白金）、群友对比与共同游戏、群友在线联动；所有结果以深色风格图片返回。自然语言查询在插件层确定性识别，不依赖 LLM、可绕过其他 Agent 类插件干扰；同时保留 LLM 函数调用作为兜底。

# 一句话短简介（市场卡片/列表展示）
short_desc: 查询 PSN 游戏库/时长/奖杯/单款游戏详情、群排行对比，图片可视化，自然语言不依赖LLM

# 语义化版本号
version: 1.3.1

# 作者
author: Eason4869

# 作者网站（个人主页）
author_url: https://github.com/Eason4869

# 插件仓库地址（市场安装/更新使用）
repo: https://github.com/Eason4869/astrbot_plugin_PlayStationGames

# 要求的 AstrBot 版本范围（PEP 440 specifier）
astrbot_version: ">=4.0.0"

# 分类 / 标签（便于市场检索）
tags:
  - 游戏
  - PlayStation
  - PSN
  - 奖杯
  - 游戏数据
  - 排行榜
  - 可视化
  - 娱乐

# 声明支持的消息平台适配器 ID（对应 AstrBot 平台适配器）。
# 说明：本插件仅使用平台无关的通用 API（指令 / 文字 / 图片 / 群号 / @ 组件），
# 理论上兼容所有支持群聊、图片与 @ 的平台；目前在 aiocqhttp（NapCat 等 QQ 实现）上实测验证，
# 其余平台按通用接口推断兼容，未逐一实测。微信公众号 / 企业微信智能机器人等
# 无群聊或被动回复受限的平台不适用群排行/@对比功能，故不列入。
support_platforms:
  - aiocqhttp            # OneBot 实现（NapCat / Lagrange / go-cqhttp 等 QQ），已实测
  - qq_official          # QQ 机器人官方 API
  - qq_official_webhook  # QQ 机器人官方 API（Webhook）
  - telegram             # Telegram
  - discord              # Discord
  - satori               # Satori 协议（Koishi 生态等）
  - lark                 # 飞书 / Lark
  - wecom                # 企业微信
  - dingtalk             # 钉钉
  - kook                 # KOOK / 开黑啦
  - slack                # Slack
  - misskey              # Misskey
  - mattermost           # Mattermost
